<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gateway Tapes - Audio Streaming Platform</title>
        <meta name="description"
            content="Open source audio streaming platform with interactive playback">
        <link rel="stylesheet" href="/css/styles.css">
        <link rel="stylesheet" href="/css/icons.css">
        <link
            href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap"
            rel="stylesheet">
        <link rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23333'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>">
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <div class="logo">
                        <span class="logo-icon" id="logoIcon"></span>
                        <h1>Gateway Tapes</h1>
                    </div>
                    <div class="header-actions">
                        <button id="searchToggle" class="icon-button"
                            title="Search">
                            <span id="searchIcon"></span>
                        </button>
                        <button id="themeToggle" class="icon-button"
                            title="Toggle theme">
                            <span id="themeIcon"></span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Search Bar -->
            <div id="searchContainer" class="search-container hidden">
                <input type="text" id="searchInput"
                    placeholder="Search for audio files..."
                    class="search-input">
                <button id="clearSearch" class="clear-search"
                    title="Clear search">
                    <span id="clearSearchIcon"></span>
                </button>
            </div>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Loading State -->
                <div id="loadingState" class="loading-state">
                    <div class="loading-spinner" id="loadingIcon"></div>
                    <p>Loading your audio collection...</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="error-state hidden">
                    <div class="error-icon" id="errorIcon"></div>
                    <h3>Something went wrong</h3>
                    <p id="errorMessage">Failed to load audio files</p>
                    <button type="button" id="retryButton"
                        class="retry-button">Try
                        Again</button>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-icon" id="emptyIcon"></div>
                    <h3>No audio files found</h3>
                    <p>Upload some audio files to your Cloudflare R2 bucket to
                        get started.</p>
                </div>

                <!-- File List -->
                <div id="fileList" class="file-list hidden">
                    <div class="list-header">
                        <h2 id="fileCount">Loading files...</h2>
                        <div class="view-controls">
                            <button id="listView" class="view-button active"
                                title="List view">
                                <span id="listViewIcon"></span>
                            </button>
                            <button id="gridView" class="view-button"
                                title="Grid view">
                                <span id="gridViewIcon"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Breadcrumb Navigation -->
                    <nav id="breadcrumbNav" class="breadcrumb-nav hidden">
                        <button type="button" id="backButton"
                            class="back-button"
                            title="Go back">
                            <span id="backIcon"></span> Back
                        </button>
                        <div class="breadcrumb-path">
                            <span class="breadcrumb-home" id="breadcrumbHome">
                                <span id="homeIcon"></span> Home
                            </span>
                            <div id="breadcrumbTrail"
                                class="breadcrumb-trail"></div>
                        </div>
                    </nav>

                    <div id="fileGrid" class="file-grid"></div>
                </div>
            </main>

            <!-- Audio Player -->
            <div id="audioPlayer" class="audio-player hidden">
                <div class="player-content">
                    <div class="track-info">
                        <div class="track-title" id="trackTitle">Select a track
                            to play</div>
                        <div class="track-meta" id="trackMeta"></div>
                    </div>

                    <div class="player-controls">
                        <button type="button" id="previousTrack"
                            class="control-button"
                            title="Previous">
                            <span id="previousIcon"></span>
                        </button>
                        <button type="button" id="playPause"
                            class="control-button play-button"
                            title="Play">
                            <span id="playPauseIcon"></span>
                        </button>
                        <button type="button" id="nextTrack"
                            class="control-button"
                            title="Next">
                            <span id="nextIcon"></span>
                        </button>
                    </div>

                    <div class="progress-section">
                        <span class="time-display" id="currentTime">0:00</span>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div id="progressFill"
                                    class="progress-fill"></div>
                                <input placeholder="progress" type="range"
                                    id="progressSlider" class="progress-slider"
                                    min="0" max="100" value="0">
                            </div>
                        </div>
                        <span class="time-display" id="totalTime">0:00</span>
                    </div>

                    <div class="volume-section">
                        <button type="button" id="muteButton"
                            class="volume-button"
                            title="Mute">
                            <span id="muteIcon"></span>
                        </button>
                        <div class="volume-container">
                            <input placeholder="volume" type="range"
                                id="volumeSlider" class="volume-slider" min="0"
                                max="100" value="50">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Current Playlist -->
            <div id="playlistPanel" class="playlist-panel hidden">
                <div class="playlist-header">
                    <h3>Now Playing</h3>
                    <button id="closePlaylist" class="close-button"
                        title="Close playlist">
                        <span id="closePlaylistIcon"></span>
                    </button>
                </div>
                <div id="currentPlaylist" class="playlist-content"></div>
            </div>
        </div>

        <!-- Audio Element -->
        <audio id="audioElement" preload="none"></audio>

        <!-- Scripts -->
        <script src="/js/icons.js"></script>
        <script src="/js/audioPlayer.js"></script>
        <script src="/js/fileManager.js"></script>
        <script src="/js/app.js"></script>
    </body>
</html>
